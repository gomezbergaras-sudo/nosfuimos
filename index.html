<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#002252">
<title>Nos Fuimos — Tu destino en buenas manos</title>
<meta http-equiv="refresh" content="0; url=/app/">
<link rel="canonical" href="https://www.nosfuimosv.com/app/">
<style>
  html,body{height:100%;margin:0;background:#002252;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;text-align:center}
  a{color:#00C6FF;font-weight:700}
</style>
</head>
<body>
<script>
  // Elimina cualquier service worker viejo registrado en la raíz
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
  }
  // Redirige a la app conservando el hash (enlaces de recuperación de contraseña)
  location.replace('/app/' + location.hash);
</script>
<p>Cargando Nos Fuimos… <br><a href="/app/">Si no avanza, toca aquí</a></p>
</body>
</html>
